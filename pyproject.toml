[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-diff-bot"
version = "0.1.1"
description = "A CI/CD bot for KiCad design review on GitHub — ERC/DRC checks with design diffs on every pull request."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Amr Muhammad", email = "20337820+amrmuhammad@users.noreply.github.com" }
]
keywords = ["kicad", "eda", "ci-cd", "hardware", "pcb", "erc", "drc", "design-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
design-diff-bot = "design_diff_bot.cli:main"

[project.urls]
Homepage = "https://github.com/amrmuhammad/design-diff-bot"
Issues = "https://github.com/amrmuhammad/design-diff-bot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
